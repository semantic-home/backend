name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: semantic_home_test
          POSTGRES_USER: semantic_home
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantic_home -d semantic_home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://semantic_home:ci-test-only@localhost:5432/semantic_home_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Test deployment connection scripts
        run: python3 .github/scripts/test_deploy_wireguard.py

      - name: Run tests
        run: uv run python -m unittest discover -s tests

  publish_image:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version_tag: ${{ steps.image.outputs.version_tag }}
    if: >
      github.event_name != 'workflow_dispatch' &&
      (github.ref_type == 'tag' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: image
        run: |
          IMAGE="${{ vars.REGISTRY_IMAGE }}"
          if [ -z "${IMAGE}" ]; then
            IMAGE="registry.myhometech.de/semantic-home/backend"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="dev-${GITHUB_SHA::7}"
          fi
          {
            echo "image=${IMAGE}"
            echo "version_tag=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.myhometech.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish_image
    if: >
      github.event_name != 'workflow_dispatch' &&
      (github.ref_type == 'tag' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment:
      name: production
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WireGuard tools
        run: |
          if ! command -v wg-quick >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi

      - name: Connect deployment VPN
        env:
          DEPLOY_WIREGUARD_CONFIG: ${{ secrets.DEPLOY_WIREGUARD_CONFIG }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy-wireguard.sh up backend

      - name: Verify VPN and SSH permissions
        run: bash .github/scripts/deploy-wireguard.sh check backend

      - name: Deploy backend on server through VPN
        env:
          DEPLOY_TAG: ${{ needs.publish_image.outputs.version_tag }}
        run: bash .github/scripts/deploy-wireguard.sh deploy backend

      - name: Close deployment VPN
        if: always()
        run: bash .github/scripts/deploy-wireguard.sh down backend

  verify_deployment_connection:
    name: Verify VPN deployment access
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WireGuard tools
        run: |
          if ! command -v wg-quick >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi

      - name: Connect deployment VPN
        env:
          DEPLOY_WIREGUARD_CONFIG: ${{ secrets.DEPLOY_WIREGUARD_CONFIG }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy-wireguard.sh up backend

      - name: Verify VPN and SSH permissions
        run: bash .github/scripts/deploy-wireguard.sh check backend

      - name: Close deployment VPN
        if: always()
        run: bash .github/scripts/deploy-wireguard.sh down backend
